</head>
<body data-step="story">
<main class="qaf2">
  <aside class="qaf2-media qaf2-theatre">
    <div class="th-beam"></div>
    <div class="th-screen"><span class="th-k">A film by</span><span class="th-name">You</span><span class="th-cr">Written &amp; Directed by You</span></div>
    <div class="th-seats"></div>
    <div class="th-figure"></div>
    <div class="qaf2-cap"><div class="ey">Almost there</div><div class="q">Every great director started with one story worth telling.</div></div>
  </aside>
  <section class="qaf2-form">
    <div class="qaf2-top">
      <a href="/" class="qaf2-logo">QURA</a>
      <div class="qaf2-progress"><span class="qaf2-bar"><span class="qaf2-bar-fill"></span></span><span class="qaf2-steplabel">Step 4 of 4</span></div>
    </div>
    <div class="qaf2-step">
      <h2 class="qaf2-h">Your story</h2>
      <p class="qaf2-sub">The part we care about most.</p>
      <div class="qaf2-fld"><label>Which craft pulls you most?</label><div class="qaf2-cards" data-field="focus"></div><div class="qaf2-other" data-for="focus" hidden><input type="text" name="focus_other" placeholder="Tell us which craft…"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label>What have you made so far?</label><div class="qaf2-cards" data-field="experience"></div><div class="qaf2-other" data-for="experience" hidden><input type="text" name="experience_other" placeholder="Tell us what you've made…"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="portfolio_link">Link to your work (Instagram, YouTube, Google Drive) — optional</label><input id="portfolio_link" name="portfolio_link" type="url" inputmode="url" placeholder="https://"><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="why">Why filmmaking, and why now?</label><p class="qaf2-help">Tell us about a film that stayed with you, or a story you want to tell.</p><textarea id="why" name="why" rows="5" minlength="150" required></textarea><div class="qaf2-count"><span class="qaf2-count-n">0</span> / 150</div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label class="qaf2-check"><input type="checkbox" name="consent" value="yes" required><span>I agree to be contacted by QURA Film Academy by phone and WhatsApp about my application, and I accept the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span></label><div class="qaf2-err"></div></div>
      <div class="qaf2-hp" aria-hidden="true"><label>Do not fill this<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="qaf2-nav">
        <button type="button" class="qaf2-btn ghost qaf2-back">Back</button>
        <button type="button" class="qaf2-btn primary qaf2-submit">Submit application</button>
      </div>
    </div>
  </section>
</main>
<script src="/assets/apply-flow.js"></script>
</body>
</html>
