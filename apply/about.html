<body data-step="about">
<main class="qaf2">
  <section class="qaf2-form">
    <div class="qaf2-top">
      <a href="/" class="qaf2-logo">QURA</a>
      <div class="qaf2-progress"><span class="qaf2-bar"><span class="qaf2-bar-fill"></span></span><span class="qaf2-steplabel">Step 1 of 4</span></div>
    </div>
    <div class="qaf2-step">
      <h2 class="qaf2-h">About you</h2>
      <p class="qaf2-sub">The basics, so our admissions team can reach you.</p>
      <div class="qaf2-fld"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" required><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="phone">WhatsApp number</label><div class="qaf2-phone"><span class="qaf2-prefix">+91</span><input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel-national" required></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="city">City</label><input id="city" name="city" type="text" autocomplete="address-level2" required><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label for="state">State</label><select id="state" name="state" required></select><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label>Your age</label><div class="qaf2-cards" data-field="age_band"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-nav">
        <button type="button" class="qaf2-btn ghost qaf2-back">Back</button>
        <button type="button" class="qaf2-btn primary qaf2-next">Next →</button>
      </div>
    </div>
  </section>
  <aside class="qaf2-media" data-images="fc-atrium.jpg,fc-avenue.jpg,fc-garden.jpg">
    <div class="qaf2-cap"><div class="ey">The intake</div><div class="q">24 seats. One cohort a year. Admission by application, exam and interview.</div></div>
  </aside>
</main>
<script src="/assets/apply-flow.js"></script>
</body>
</html>
