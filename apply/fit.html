<body data-step="fit">
<main class="qaf2">
  <aside class="qaf2-media" data-portraits="advisory-kamal.jpg|Kamal Haasan|Actor · Filmmaker|Nayakan · Vikram · 4 National Awards;advisory-mani.jpg|Mani Ratnam|Director|Nayakan · Roja · 7 National Awards;advisory-pcsreeram.jpg|P. C. Sreeram|Cinematographer, ISC|Mouna Ragam · President, Qube Cinema;advisory-sreekar.jpg|A. Sreekar Prasad|Editor|RRR · 9 National Awards · Oscar Academy member;advisory-jayendra.jpg|Jayendra Panchapakesan|Filmmaker|Co-founder, Qube Cinema;advisory-senthil.jpg|Senthil Kumar|Technologist|Co-founder, Qube Cinema · Digital-cinema pioneer">
    <div class="qaf2-cap"><div class="ey">Advisory board</div><div class="q">Learn beside the masters of Indian cinema.</div></div>
  </aside>
  <section class="qaf2-form">
    <div class="qaf2-top">
      <a href="/" class="qaf2-logo">QURA</a>
      <div class="qaf2-progress"><span class="qaf2-bar"><span class="qaf2-bar-fill"></span></span><span class="qaf2-steplabel">Step 2 of 4</span></div>
    </div>
    <div class="qaf2-step">
      <h2 class="qaf2-h">Is QURA right for you?</h2>
      <p class="qaf2-sub">A few honest questions — there are no wrong answers.</p>
      <div class="qaf2-fld"><label>Where are you right now?</label><div class="qaf2-cards" data-field="current_status"></div><div class="qaf2-other" data-for="current_status" hidden><input type="text" name="current_status_other" placeholder="Tell us where you are…"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label>What are you looking for? <span class="brk">(QURA is a full-time, 1-year filmmaking programme)</span></label><div class="qaf2-cards" data-field="looking_for"></div><div class="qaf2-other" data-for="looking_for" hidden><input type="text" name="looking_for_other" placeholder="Tell us what you're looking for…"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label>Classes at QURA are taught in English. How comfortable are you with English?</label><div class="qaf2-cards" data-field="english"></div><div class="qaf2-err"></div></div>
      <div class="qaf2-fld"><label>QURA is a full-time, in-person programme at our Chennai campus. Can you be in Chennai from January 2027?</label><div class="qaf2-cards" data-field="relocate"></div><div class="qaf2-err"></div></div>

        <button type="button" class="qaf2-btn primary qaf2-next">Next →</button>
